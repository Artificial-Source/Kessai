[package]
name = "kessai-core"
version = "0.1.0"
edition = "2021"
description = "Core business logic library for Kessai subscription tracker"

[features]
schemars = ["dep:schemars"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
schemars = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[package]
name = "kessai-mcp"
version = "1.0.0"
edition = "2021"
description = "MCP server for Kessai subscription tracker"

[[bin]]
name = "kessai-mcp"
path = "src/main.rs"

[dependencies]
kessai-core = { path = "../kessai-core", features = ["schemars"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "1.8", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
schemars = "1"
chrono = "0.4"
thiserror = "2"
comfy-table = "7"
colored = "3"
subtle = "2"
tempfile = "3"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

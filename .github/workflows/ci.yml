name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        type: string
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, format check
        run: pnpm check

      - name: Tauri dependency alignment
        run: pnpm check:tauri-versions

      - name: Unit and component tests
        run: pnpm test:run

      - name: Installer and packaged-skill tests
        run: pnpm test:installer

      - name: Release preflight regression tests
        run: node scripts/release-dry-run.js --self-test

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Build frontend
        run: pnpm build && pnpm verify:web-resource

  # Dedicated headless real-web coverage; does not claim native desktop coverage.
  e2e-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # run-web-smoke.js creates a temporary database, never the user's database.
      - run: pnpm test:e2e:web-smoke

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Rust Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Install dependency auditor
        run: cargo install cargo-audit --locked --version 0.22.0

      - name: Rust dependency audit
        run: cargo audit

      - name: Run Rust tests
        run: cargo test --locked --workspace

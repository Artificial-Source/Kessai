[package]
name = "kessai"
version = "1.0.0"
description = "Know where your money flows - Personal subscription tracker"
authors = ["ASF", "Andrés (NewStella)"]
license = "MIT"
edition = "2021"

[lib]
name = "kessai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3", "common-controls-v6"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "=2.5.1"
kessai-core = { path = "../crates/kessai-core" }
kessai-web = { path = "../crates/kessai-web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
